name: Build CS2 Bhop Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Prepare & Build Mod
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
          fi
          if [ -d "cs2bhop" ]; then
            cd cs2bhop
          fi
          gradle build --no-daemon

      - name: Upload Built Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: cs2bhop-1.20.1-mod-jar
          path: "**/build/libs/*.jar"
